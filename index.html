<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#272d26" />
    <!-- Full screen when opened from the phone's home screen -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Hồ sơ voi" />
    <link rel="apple-touch-icon" href="./assets/shared/icon-192.png" />
    <meta
      name="description"
      content="Hồ sơ voi thất lạc — một hành trình tương tác từ hành tinh SPARK đến Tây Nguyên, Việt Nam."
    />
    <title>The Lost Elephant Archive · Hồ sơ voi thất lạc</title>
    <link rel="icon" href="./assets/shared/ui_02.webp" />
    <link
      rel="preload"
      as="image"
      href="./assets/backgrounds/pr_bg01_spark_exterior.webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      href="./assets/fonts/noto-serif-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./css/game.css?v=spark4" />
    <link rel="stylesheet" href="./css/field.css?v=spark4" />
    <link rel="stylesheet" href="./css/epilogue.css?v=spark4" />
  </head>
  <body>
    <main id="stage" tabindex="-1" aria-label="Hồ sơ voi thất lạc">
      <div id="backdrop" aria-hidden="true"></div>
      <div id="shade" aria-hidden="true"></div>
      <div id="art"></div>
      <header class="toolbar">
        <div class="chapter-tag">
          <span class="emblem" aria-hidden="true">✧</span
          ><span id="chapter-label">PROLOGUE</span><i></i
          ><span id="scene-count">01 / 09</span>
        </div>
        <div class="tools">
          <button
            id="fullscreen"
            type="button"
            aria-pressed="false"
            aria-label="Toàn màn hình"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path class="fs-enter" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
              <path class="fs-exit" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" />
            </svg>
          </button>
          <button
            id="sound"
            type="button"
            aria-pressed="false"
            aria-label="Bật âm thanh"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 9h4l5-4v14l-5-4H3z" />
              <path class="sound-wave" d="M15 8q5 4 0 8m3-11q8 7 0 14" />
              <path class="sound-off" d="m16 9 5 6m0-6-5 6" /></svg
            ><span>SOUND</span>
          </button>
          <button id="field-book" type="button" hidden>Sổ tay</button>
          <button id="skip" type="button" aria-label="Bỏ qua Prologue">
            SKIP <span aria-hidden="true">»</span>
          </button>
        </div>
      </header>
      <section id="dialogue" aria-label="Lời thoại">
        <div class="dialogue-surface" aria-hidden="true"></div>
        <button id="prev" type="button" aria-label="Lời thoại trước">‹</button>
        <div class="dialogue-copy">
          <span id="speaker"></span>
          <p id="line" aria-hidden="true"></p>
          <p id="spoken" class="sr" aria-live="polite" aria-atomic="true"></p>
        </div>
        <button id="next" type="button" aria-label="Lời thoại tiếp">›</button>
      </section>
      <div id="tap-hint" aria-hidden="true">
        Chạm bên trái để lùi <span>·</span> Chạm bên phải để sang câu tiếp
      </div>
    </main>
    <div id="rotate">
      <img src="./assets/shared/ui_02.webp" alt="" />
      <h2>Xoay ngang điện thoại</h2>
      <p>Bạn sẽ nhìn trọn khung cảnh và đọc lời thoại dễ hơn.</p>
      <button id="rotate-fullscreen" class="action" type="button" hidden>
        Toàn màn hình (ẩn thanh trình duyệt)
      </button>
      <button id="portrait-play" class="action">Tiếp tục ở chế độ dọc</button>
    </div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div id="modal-body"></div>
      <button id="modal-close" class="close" aria-label="Đóng">×</button>
    </dialog>
    <noscript>Vui lòng bật JavaScript để chơi Hồ sơ voi thất lạc.</noscript>
    <script type="module" src="./js/main.js?v=spark4"></script>
  </body>
</html>
